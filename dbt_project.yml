name: ga4_platform
version: "1.0.0"
profile: ga4_platform

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Zakres shardow events_YYYYMMDD. Do taniego testu: --vars "{ga4_end: '20201107'}"
  ga4_start: "20201101"
  ga4_end: "20210131"
  # Wlasne domeny (male litery) - pomijane przy ustalaniu zrodla sesji (self-referral).
  # Pasuje domena dokladnie albo jej subdomena (shop.<domena>).
  ga4_own_domains: ['googlemerchandisestore.com']
  # Gold, model sesji z Time (B10): pary 'source / medium' (male litery), ktore otwieraja nowa sesje.
  gld_priority_sources: ['google / organic', 'google / cpc', 'bing / organic', '<other> / organic']
  # Strony glowne (adres bez parametrow, male litery): (direct) na stronie glownej tez otwiera sesje.
  gld_homepages: ['https://www.googlemerchandisestore.com/', 'https://shop.googlemerchandisestore.com/']

models:
  ga4_platform:
    bronze:
      +schema: bronze
      +materialized: table
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table